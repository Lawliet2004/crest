<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
  :root {
    color-scheme: dark;
    font-family: system-ui, sans-serif;
    color: #edfafa;
    background: #0e262e;
    --mint: #92eadb;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    grid-template-rows: 1fr auto;
    background:
      linear-gradient(180deg, #08232c22, #09252d44 47%, #06171ed6),
      url("deep-water.webp") center center / cover no-repeat,
      radial-gradient(ellipse at 74% 15%, #237d84, #102c35 65%);
  }
  main {
    display: grid;
    align-content: center;
    justify-items: center;
    padding: clamp(30px, 7vh, 76px) 20px max(28px, 8vh);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2vw, 22px);
    text-shadow: 0 5px 30px #071b23a8;
  }
  .crest-mark {
    width: clamp(46px, 7vw, 66px);
    height: auto;
    color: #acffeb;
    filter: drop-shadow(0 6px 24px #001c2a55);
  }
  h1 { margin: 0; font-size: clamp(50px, 8vw, 84px); font-weight: 680; letter-spacing: -.072em; line-height: .96; }
  .search {
    width: min(100%, 600px);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 7px 6px 18px;
    margin: clamp(25px, 5vh, 40px) 0 0;
    border-radius: 100px;
    border: 1px solid #a4deeb60;
    background: #0f252fef;
    box-shadow: 0 14px 38px #001c2a70;
  }
  .search:focus-within { border-color: var(--mint); box-shadow: 0 0 0 2px #92eadb55, 0 14px 38px #001c2a70; }
  .search > svg { color: #abc9cf; flex: none; }
  .search input {
    flex: 1;
    min-width: 0;
    padding: 8px 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    outline: none;
  }
  .search input::placeholder { color: #b2cbd1; opacity: 1; }
  .search button {
    display: grid;
    place-items: center;
    flex: none;
    width: 44px;
    height: 38px;
    padding: 0;
    border: 0;
    border-radius: 50px;
    background: var(--mint);
    color: #10323b;
    cursor: pointer;
  }
  .search button:hover { background: #b3f7ea; }
  :focus-visible { outline: 2px solid #bafff0; outline-offset: 3px; }
  .links { width: min(100%, 508px); margin-top: clamp(23px, 4.4vh, 39px); }
  .links h2 {
    margin: 0 0 11px;
    color: #f0fbfb;
    text-shadow: 0 2px 10px #001820;
    font-size: 11px;
    font-weight: 670;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .shortcuts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .shortcuts a {
    display: grid;
    justify-items: center;
    gap: 7px;
    min-width: 0;
    padding: 11px 4px 9px;
    color: #e7f4f5;
    text-decoration: none;
    background: #0d2530db;
    border: 1px solid #bceaf330;
    border-radius: 13px;
    font-size: 12px;
    font-weight: 550;
  }
  .shortcuts a:hover { background: #1f4550; border-color: #92eadb88; }
  .shortcuts svg { width: 21px; height: 21px; color: #a0e4da; }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 9px;
    padding: 14px clamp(16px, 3vw, 34px) 17px;
    font-size: 11px;
    color: #bad6da;
  }
  kbd {
    font: inherit;
    padding: 2px 5px;
    margin-right: 4px;
    background: #09252ce0;
    border: 1px solid #bceaf343;
    border-radius: 5px;
  }
  @media (max-width: 420px) {
    .shortcuts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-height: 400px) {
    main { padding-block: 16px 12px; }
    .crest-mark { width: 42px; }
    h1 { font-size: 44px; }
    .search { margin-top: 20px; }
    .links { margin-top: 16px; }
    footer { padding-block: 10px; }
  }
</style>
<main>
  <div class="brand">
    <svg class="crest-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="62" height="62" rx="17" fill="#10343d" fill-opacity=".86" stroke="#9ce5df" stroke-opacity=".57"/>
      <path d="M12 43 28 19l9 14 6-9 10 19H12Z" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
    </svg>
    <h1>Crest</h1>
  </div>
  <form class="search" action="/search" method="get" role="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="5.5"/>
      <path d="m15 15 4 4"/>
    </svg>
    <input type="text" name="q" aria-label="Search the web or enter an address" placeholder="Search the web or enter an address" maxlength="2048" autocomplete="off" spellcheck="false" required>
    <button type="submit" aria-label="Go">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14m-6-6 6 6-6 6"/>
      </svg>
    </button>
  </form>
  <section class="links" aria-labelledby="links-title">
    <h2 id="links-title">Quick links</h2>
    <div class="shortcuts">
      <a href="https://github.com/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 4l-4 16"/></svg>
        GitHub
      </a>
      <a href="https://www.youtube.com/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3Z" fill="currentColor"/></svg>
        YouTube
      </a>
      <a href="https://www.wikipedia.org/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7C9 4 6 4 3 5v14c3-1 6-1 9 2 3-3 6-3 9-2V5c-3-1-6-1-9 2Zm0 0v14"/></svg>
        Wikipedia
      </a>
      <a href="https://maps.google.com/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.4"/></svg>
        Maps
      </a>
    </div>
  </section>
</main>
<footer>
  <span>Deep Water</span>
  <span><kbd>Ctrl</kbd><kbd>L</kbd> Address bar</span>
</footer>
</html>
