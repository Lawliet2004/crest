<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(ellipse at 80% 15%, #cfe8e1, transparent 55%), #f6f9f7;
    color: #173b36;
  }
  main { max-width: 36rem; margin: 2rem; text-align: center; }
  svg { width: 76px; height: 76px; color: #177b6c; margin-bottom: 0.75rem; }
  h1 { font-size: clamp(2rem, 7vw, 4rem); letter-spacing: -.055em; margin: 0; }
  p { margin: 1rem 0 0; line-height: 1.6; }
  kbd { font: inherit; font-size: .9em; border: 1px solid #95b5ae; border-radius: 6px; padding: .12em .4em; }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(ellipse at 80% 15%, #174741, transparent 55%), #132725; color: #e9f5f2; }
    svg { color: #78cebb; }
  }
</style>
<main>
  <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <rect width="64" height="64" rx="18" fill="currentColor"/>
    <path d="M12 43 28 19l9 14 6-9 10 19H12Z" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
  </svg>
  <h1>Crest Browser</h1>
  <p>Search or enter an address above. Press <kbd>Ctrl</kbd> + <kbd>L</kbd> to jump there.</p>
</main>
</html>
